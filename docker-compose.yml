services:
  ssl-certbot:
    build:
      context: .
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    image: ${DOCKER_REG_ORG}/${DOCKER_IMG_NAME}:${DOCKER_IMG_TAG:-latest}
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - ssl_data:/etc/letsencrypt
    tmpfs:
      - /var/lib/letsencrypt
    restart: always

volumes:
  ssl_data:
    name: ssl_data
    driver: local
    