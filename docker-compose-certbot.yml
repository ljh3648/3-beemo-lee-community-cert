services:
  ssl-certbot:
    build: . ${DOCKER_IMG_ORG}/${DOCKER_IMG_NAME}:${DOCKER_IMG_TAG:-latest}
    image: ${DOCKER_IMG_ORG}/${DOCKER_IMG_NAME}:${DOCKER_IMG_TAG:-latest}
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - ssl_data:/app

volumes:
  ssl_data:
    driver: local